<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect width="1000" height="700" fill="#ffffff"/>

  <g transform="translate(90 265)">
    <!-- inner joint housing -->
    <ellipse cx="115" cy="85" rx="82" ry="78" fill="#373b3f"/>
    <ellipse cx="115" cy="85" rx="56" ry="52" fill="#555b60"/>
    <ellipse cx="115" cy="85" rx="27" ry="25" fill="#25282b"/>

    <!-- neck -->
    <rect x="165" y="58" width="100" height="54" rx="18" fill="#44494e"/>

    <!-- main shaft -->
    <rect x="250" y="67" width="430" height="36" rx="18" fill="#24282c"/>

    <!-- wrench section -->
    <polygon
      points="650,57 720,57 744,85 720,113 650,113 626,85"
      fill="#5d6368"
    />

    <!-- threaded end -->
    <rect x="720" y="70" width="155" height="30" rx="8" fill="#383d41"/>

    <!-- thread lines -->
    <g stroke="#8a9095" stroke-width="5">
      <line x1="742" y1="70" x2="728" y2="100"/>
      <line x1="765" y1="70" x2="751" y2="100"/>
      <line x1="788" y1="70" x2="774" y2="100"/>
      <line x1="811" y1="70" x2="797" y2="100"/>
      <line x1="834" y1="70" x2="820" y2="100"/>
      <line x1="857" y1="70" x2="843" y2="100"/>
    </g>

    <!-- nut -->
    <polygon
      points="815,55 865,55 885,85 865,115 815,115 795,85"
      fill="#70767b"
    />
  </g>

  <text
    x="500"
    y="565"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#344054"
  >
    INNER TIE ROD
  </text>

  <text
    x="500"
    y="610"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="22"
    fill="#98a2b3"
  >
    Reference component illustration
  </text>
</svg>
